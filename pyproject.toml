[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ped2studio"
version = "0.2.2"
description = "Convert PED and MPED pedigree files to Pedigree Studio session JSON"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
keywords = ["pedigree", "genetics", "ped", "mped", "family-tree", "clinical-genetics"]
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ped2studio = "ped2studio.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/ped2studio"
Issues = "https://github.com/comparativechrono/ped2studio/issues"
Changelog = "https://github.com/comparativechrono/ped2studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ped2studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
